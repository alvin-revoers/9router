# Render Blueprint untuk 9router — deploy sekali klik
# Cara pakai: di Render pilih New → Blueprint → connect repo ini.

services:
  - type: web
    name: ninerouter
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
